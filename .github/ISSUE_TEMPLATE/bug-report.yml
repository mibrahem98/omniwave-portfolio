name: Bug report
description: Report a reproducible issue in OmniWave.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve OmniWave. Do not include audio files, local paths, exports, or personal listening data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest reliable sequence of actions.
      placeholder: "1. Open…\n2. Tap…\n3. Observe…"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["iOS", "Android", "Web preview", "Other"]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: App and device details
      description: Include app version, OS version, and device class. Exclude identifiers and private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed audio files, URIs, local paths, tokens, and personal metadata.
          required: true
